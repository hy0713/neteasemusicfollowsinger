<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; worker-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'">
  <title>跟唱伴学</title><link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <header class="brand"><div class="brand-mark">♫</div><div><strong>跟唱伴学</strong><span>FOLLOW SINGER</span></div><button id="source-chip" class="source-chip" aria-label="切换音源">本地练习 ▾</button></header>
  <section class="song-head"><div class="cover"><span id="cover-label">♫</span><div class="cover-bars"><i></i><i></i><i></i><i></i><i></i></div></div><div class="song-meta"><h1 id="song-title">选择一首歌，开始跟唱</h1><p id="song-artist">把陌生的语言，唱成自己的声音</p><div id="connection"><i></i><span>本地练习 · 离线读音</span></div></div></section>
  <section class="reading-tools" aria-label="读音选项"><label class="select-wrap"><select id="language" aria-label="歌词语言"><option value="auto">自动识别</option><option value="ja">日语</option><option value="en">英语</option><option value="ru">俄语</option><option value="fr">法语</option><option value="ko">韩语</option></select></label><div id="japanese-switch" class="segmented" hidden><button id="kana" class="selected">假名</button><button id="romaji">罗马音</button></div><span id="reading-kind" class="reading-kind">本地读音</span><label class="beginner-label"><input id="beginner" type="checkbox"><span class="switch"></span>新手</label></section>
  <div class="lyric-top"><span id="language-caption">五种语言 · 跟唱练习</span><span id="line-count"></span></div>
  <section id="lyric-viewport" tabindex="0" aria-label="滚动歌词"><div id="lyrics"></div><div id="empty" class="empty"><div class="empty-note">♪</div><h2>从听懂第一句开始</h2><p>原文、读音、译文，一起跟上节奏。<br>完全不会读？试试右上角「新手」。</p><button id="try-sample" class="primary">体验法语跟唱</button><button id="open-library" class="text-button">选择本地歌曲或网易云歌词 →</button><small>内置示例为原创短句与提示音，无歌曲人声</small></div></section>
  <button id="resume-follow" class="resume-follow" hidden>回到当前句 ↓</button>
  <div id="notice" role="status" aria-live="polite" hidden></div>
  <footer class="player"><div class="seek-row"><input id="progress" type="range" min="0" max="1000" value="0" aria-label="播放进度" disabled></div><div class="times"><span id="elapsed">0:00</span><span id="timeline-note">点击歌词可跳转</span><span id="duration">0:00</span></div><div class="transport"><button id="rate" class="compact-control" disabled><b>1.0×</b><small>倍速</small></button><button id="previous" class="icon-button" aria-label="上一句" disabled>⏮</button><button id="play" class="play-button" aria-label="播放" disabled>▶</button><button id="next" class="icon-button" aria-label="下一句" disabled>⏭</button><button id="loop" class="compact-control" disabled><b>↻</b><small>单句循环</small></button></div></footer>
  <nav class="bottom-nav"><button id="practice-tab" class="active"><span>♫</span>跟唱</button><button id="library-tab"><span>▤</span>曲库</button><button id="settings-tab"><span>⚙</span>设置</button></nav>
</main>
<div id="sheet-backdrop" hidden><section id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-handle"></div><header class="sheet-header"><h2 id="sheet-title">曲库</h2><button id="close-sheet" class="icon-button" aria-label="关闭">×</button></header><div id="sheet-body"></div></section></div>
<template id="library-template"><div class="source-tabs"><button data-mode="local">本地练习</button><button data-mode="netease">网易云同步</button></div><div class="library-section"><h3>自己的歌曲</h3><p class="muted">先选择音频，再导入对应的 LRC 歌词。</p><div class="file-grid"><button data-pick="audio">♫<strong>打开音频</strong><small>MP3 / M4A / WAV</small></button><button data-pick="lrc">▤<strong>导入歌词</strong><small>LRC 逐行时间轴</small></button></div><button data-pick="translation" class="outline wide">导入中文译文 LRC</button></div><div class="library-section"><h3>网易云歌曲歌词</h3><p class="muted">搜索歌名 / 歌手，或粘贴歌曲链接、ID。这里只获取歌词。</p><form id="search-form" class="search-form"><input id="search-query" placeholder="歌名、歌手、歌曲链接或 ID" autocomplete="off" aria-label="搜索歌曲"><button type="submit" class="primary">搜索</button></form><div id="search-results"></div><button id="grant-access" class="outline wide">开启网易云播放同步</button><p class="small muted">同步需要通知使用权，仅连接网易云媒体会话。请在网易云开始播放；不读取聊天通知、不要求登录或 Cookie。</p></div><div class="library-section"><h3>五语体验</h3><p class="muted">原创短句 + 中文译文 + 合成提示音</p><div class="sample-grid"><button data-sample="ja"><b>あ</b>日语</button><button data-sample="en"><b>Aa</b>英语</button><button data-sample="ru"><b>Я</b>俄语</button><button data-sample="fr"><b>é</b>法语</button><button data-sample="ko"><b>한</b>韩语</button></div></div></template>
<template id="settings-template"><h3>选择皮肤</h3><div id="theme-list"></div><h3>歌词显示</h3><label class="setting-row">显示读音<input id="show-reading" type="checkbox"></label><label class="setting-row">显示中文译文<input id="show-translation" type="checkbox"></label><label class="setting-row">新手汉字谐音<input id="setting-beginner" type="checkbox"></label><p class="small muted">谐音仅帮助第一遍模仿，请忽略汉字声调，结合原唱听音；不是翻译，也不能完整表达所有外语音素。</p><label class="setting-row">原文字号 <span id="size-value"></span></label><input id="font-size" class="wide" type="range" min="20" max="36" step="1"><label class="setting-row">歌词延迟 <span id="offset-value"></span></label><div class="offset-control"><button id="offset-minus" class="outline">− 0.1 秒</button><button id="offset-reset" class="text-button">归零</button><button id="offset-plus" class="outline">+ 0.1 秒</button></div><p class="small muted">正值让歌词晚出现，负值让歌词提前。</p><h3>关于跟唱伴学</h3><p class="small muted">Android 0.1.0 · 本地转换，无付费 API。<br>日语词典读音；英语 / 法语 IPA；俄语 / 韩语转写。音标基于文字，可能与实际歌唱中的连读、重音和音变不同。</p><button id="licenses" class="outline wide">开源许可证与来源</button></template>
<script type="module" src="app.mjs"></script>
</body></html>
